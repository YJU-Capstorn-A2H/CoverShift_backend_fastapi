# CoverShift MVP 시연 스택 (D-1, V9_ko 506-511): Postgres + Aegra(그래프) + 입구 API + LINE 발송기 + 화면.
#
#   띄우기   docker compose -f compose.yaml -p mvp-demo up -d --build --wait
#   상태     docker compose -p mvp-demo ps
#   내리기   docker compose -p mvp-demo down          ← -v 를 붙이지 않는다: 승인 대기 체크포인트(D-2)가 볼륨째 지워진다
#
# - 값은 전부 .env 에서 ${VAR} 로 받는다 (이름은 .env.example). 키 · 비밀번호를 이 파일에 쓰지 않는다 (V9_ko 511).
#   필수 값이 비면 `${VAR:?…}` 가 띄우기 전에 멈춘다.
# - 포트는 전부 127.0.0.1 에만 연다. 시험 DB(5443) · 기존 DB(5433 · 5441)와 겹치지 않게 db 는 5444.
# - 이미지 · 패키지 버전 고정: postgres 16.6-alpine, 앱 이미지는 Dockerfile(python 3.14.5 · uv 0.13.5 · uv.lock --frozen,
#   aegra-cli 0.10.8 은 pyproject 고정), 화면은 web.Dockerfile(node 22.21.1 · nginx 1.28.0).
# - Aegra 는 Redis 없이(프로세스 안 실행) 돈다. 실측(11/12, 로컬 Aegra 프로세스 · 가짜 그래프): run 도중 Aegra 가 SIGKILL 되면 그 run 은 'running' 으로
#   남아 그 thread 는 계속 Busy, SIGTERM 이면 'interrupted' 로 남아 status=error. 승인 대기 중 재시작은 문제없음(D-3).
name: mvp-demo

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  image: covershift-mvp:demo
  restart: unless-stopped
  init: true          # MCP 서버(stdio 자식 프로세스)를 거둔다
  depends_on:
    db:
      condition: service_healthy

# api · aegra(그래프 노드가 도는 곳) · line-dispatcher 가 같이 쓰는 설정. 앱 DB 와 Aegra 표 · 체크포인트는 같은 DB 를 쓴다
# (Aegra 도 DATABASE_URL 을 읽기 때문 — 이름이 겹치는 표는 없음: Aegra = assistant · thread · runs · checkpoints …, 앱 = 17개).
# 비밀번호에 @ / # % 같은 글자가 있으면 URL 인코딩해서 넣는다.
x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-covershift}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣는다}@db:5432/${POSTGRES_DB:-covershift}
  TZ: Asia/Tokyo
  LLM_MODE: ${LLM_MODE:-fake}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
  LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-600}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-64000}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AUTO_RETRY_LIMIT: ${AUTO_RETRY_LIMIT:-3}
  MANAGER_REQUEST_LIMIT: ${MANAGER_REQUEST_LIMIT:-2}
  ENABLE_SURPLUS: ${ENABLE_SURPLUS:-false}
  ENABLE_HALF_LEAVE_CHECK: ${ENABLE_HALF_LEAVE_CHECK:-false}
  ENABLE_REGULAR_AVAILABILITY_WARNING: ${ENABLE_REGULAR_AVAILABILITY_WARNING:-false}
  ENABLE_CONTACT: ${ENABLE_CONTACT:-false}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:5173}
  MCP_MODE: ${MCP_MODE:-stdio}   # collect 가 직원 정보를 MCP(stdio)로 읽는다 (M-7, G7 · app/graph/deps.py)
  # LINE (A-20 ~ A-22). stub = 보내지 않고 기록만. line 이면 아래 세 값이 하나라도 비어 있을 때 api · 발송기가 시작하지 않고,
  # aegra 는 그래프 파일(app/graph/aegra_entry.py)을 읽다가 같은 오류를 낸다 (app/config.py ConfigError)
  LINE_MODE: ${LINE_MODE:-stub}
  LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
  LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
  LINE_OFFICIAL_ACCOUNT_ID: ${LINE_OFFICIAL_ACCOUNT_ID:-}

services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-covershift}
      POSTGRES_USER: ${POSTGRES_USER:-covershift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣는다}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 볼륨이 비어 있을 때 한 번만 이름 순서로 적용 (001 = 추천안, 002 = 로컬 mvp 가 쓰는 추가 표). 이미 데이터가 있으면 다시 돌지 않는다
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20

  aegra:
    <<: *app-build
    # aegra serve 대신 uvicorn 을 바로 PID 1 로: aegra serve 는 uvicorn 을 자식으로 띄워 종료 신호가 안 닿는다
    # (prototype_skeleton 결함 7 「aegra serve 를 죽여도 uvicorn 자식이 살아남음」)
    command: ["uvicorn", "aegra_api.main:app", "--host", "0.0.0.0", "--port", "2026"]
    environment:
      <<: *app-env
      AEGRA_CONFIG: /app/aegra.json
      AUTH_TYPE: noop                 # Aegra 는 127.0.0.1 · 컨테이너망에만 열고, 인증은 입구 API 가 한다 (A-14)
      REDIS_BROKER_ENABLED: "false"
      CRON_ENABLED: "false"
      ENV_MODE: LOCAL
      LOG_LEVEL: ${AEGRA_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${AEGRA_HOST_PORT:-2026}:2026"   # 호스트 쪽 포트만 바꾼다 (2026 을 다른 프로젝트가 쓰고 있을 때). api 는 컨테이너망 aegra:2026 으로 붙는다
    volumes:
      - llm-logs:/app/logs            # LLM 측정 기록 (편성 호출은 이 서비스에서 일어난다) — 리뷰 A D1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2026/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    <<: *app-build
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      <<: *app-env
      RUNNER: aegra
      AEGRA_URL: http://aegra:2026
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 넣는다}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      DEV_SKIP_AUTH: ${DEV_SKIP_AUTH:-false}
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - llm-logs:/app/logs            # 지시 미리보기의 LLM 호출 기록
    depends_on:
      db:
        condition: service_healthy
      aegra:
        condition: service_healthy
    healthcheck:
      # 어떤 HTTP 응답이든(401 포함) 오면 살아 있다고 본다 — 헬스 전용 경로는 API 계약에 없다
      test: ["CMD", "python", "-c", "import urllib.request, urllib.error\ntry: urllib.request.urlopen('http://127.0.0.1:8010/api/auth/me', timeout=3)\nexcept urllib.error.HTTPError: pass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # line_outbox 의 「대기」 행을 한 건씩 보낸다 (A-21). 포트를 열지 않는다. 여러 개 띄워도 같은 행을 두 번 보내지 않는다
  line-dispatcher:
    <<: *app-build
    command: ["python", "-m", "app.line_dispatcher"]
    # SIGTERM 을 받으면 보내던 한 건을 마치고 끝난다. push 한 번은 최악 약 24초(연결 · 보내기 · 받기 각 8초, app/line_api.py)
    # → 그보다 길게 기다린다. 기본값(10초)이면 보내는 도중 SIGKILL 될 수 있다 (그래도 행은 pending 으로 남아 다시 나간다)
    stop_grace_period: 40s
    environment:
      <<: *app-env

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    image: covershift-web:demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"   # PUBLIC_BASE_URL 기본값과 같은 주소 (제출 링크 · LINE 연결 링크가 이 주소를 가리킨다)
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  llm-logs:
