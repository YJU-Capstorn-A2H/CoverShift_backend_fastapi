<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>CoverShift</title>
    <script>
      // 첫 그림 전에 테마를 적용해 깜빡임을 막는다. 저장소가 막혀 있어도 화면은 그대로 뜬다.
      try {
        // 기본 = 라이트. 저장된 「system」이면 속성을 두지 않아 OS 설정을 따른다 (theme.ts 와 같은 규칙)
        var t = localStorage.getItem('covershift.theme')
        if (t !== 'system') document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
